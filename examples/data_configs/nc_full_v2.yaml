reader:
  kind: nc
  path: ./datasets/cylinder2d.nc
  var_keys: ["u", "v"]
  u_key: u
  v_key: v
  want_omega: false
  dx: 0.1
  dy: 0.1
  time_key: tdim
  y_key: ydim
  x_key: xdim

sampler:
  kind: per_frame

transforms:
  capture_nan_mask: { target_only: true }
  normalize: { method: zscore }

split:
  enable: true
  strategy: temporal
  unit: frame
  ratios: { train: 0.8, val: 0.1, test: 0.1 }
  seed: 123

batch_size: 32
num_workers: 8
shuffle: true
pin_memory: true
persistent_workers: true
prefetch_factor: 4
drop_last: false

output:
  out_dir: ./prep_out/nc_full_v2
  save_array5d: true
  snapshot:
    enable: true
    part_size_gb: 1.0
    gzip: false
    base_mode: clean       # ← 新增：因子化“干净底稿”标记
  overwrite: true

# （可选，仅用于 Notebook 一键预览时在线注入；不会写入磁盘）
factors:
  sample_density: null     # 例如 0.05（5%）时填数；null 表示不注入
  noise_sigma: null        # 例如 0.01
  rng_seed_offset: 0
