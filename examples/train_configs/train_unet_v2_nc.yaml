# ==========================================================
# 完整训练/验证/测试（Trainer + Callbacks + Logger + Eval）
# 适配当前的 EPD 模型与 train/ 侧代码
# ==========================================================

exp_name: &exp_name "unet_baseline_epd_nc_v2"

# --------- 模型装配（EPDSystem：Encoder→Propagator→Decoder→Head）---------
model:
  encoder:    { name: UNetBase, args: { in_channels: 3, base_channels: 32, depth: 4 } }
  propagator: { name: Identity, args: {} }
  decoder:    { name: UNetBase, args: { base_channels: 32 } }
  head:       { name: PixelHead, args: { out_channels: 1 } }

  loss:       { name: l1 }
  optimizer:  { name: adamw, args: { lr: 1.0e-3, weight_decay: 1.0e-4 } }
  scheduler:  { name: ReduceLROnPlateau, monitor: "val_total", args: { factor: 0.5, patience: 5 } }
  reg_weights: { encoder: 0.0, propagator: 0.0, decoder: 0.0, head: 0.0 }

# --------- 数据 ---------
data:
  builder: backend.dataio.api:build_all
  builder_args:
    snapshot_dir: "prep_out/nc_full_v2"    # 指向那份“干净快照”
  # 单轮默认值（可为 null），sweep 时会被覆盖
  # factors:
  #   sample_density: 0.05
  #   noise_sigma: 0.01
  #   rng_seed_offset: 0

  # 新增：全因子矩阵设定
  sweep:
    enable: true
    # p_list: [0.01, 0.03, 0.05, 0.07, 0.10]
    p_list: [0.01, 0.05]
    # sigma_list: [0.000, 0.005, 0.010, 0.020, 0.030]
    sigma_list: [0.000, 0.010]
    mode: grid
    reuse_snapshot: true   # 如果从旧 run 复用数据来源，也优先走“因子化快照重构”，而不是旧的 pickled DL
  batch_size: 32
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  drop_last: false
  save_dataloaders: false

# --------- Trainer 配置（Lightning）---------
trainer:
  max_epochs: null
  max_steps: 200
  precision: "bf16-mixed"           # 可选: "32" | "bf16-mixed"
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  log_every_n_steps: 10
  val_check_interval: 1.0
  gradient_clip_val: 0.0
  accumulate_grad_batches: 1
  deterministic: false
  benchmark: false
  num_sanity_val_steps: 2
  enable_checkpointing: true
  enable_model_summary: false

# --------- 日志系统 ---------
logging:
  logger: "tensorboard"           # 也可 "csv" | "jsonl"
  save_dir: "runs"
  name: *exp_name             # 运行目录: runs/<exp_name>/<version>/
  version: null                   # 留空=自动用时间戳

# --------- 回调：早停、Checkpoint、学习率、可视化、梯度范数 ---------
callbacks:
  early_stopping:
    enable: true
    monitor: "val_total"
    mode: "min"
    patience: 10
    min_delta: 0.0

  checkpoint:
    monitor: "val_total"
    mode: "min"
    save_top_k: 1
    save_last: true
    dirpath: null                  # 默认: runs/<exp>/<ver>/checkpoints
    filename: "{epoch:03d}-{val_total:.4f}"
    load_from: null                # 仅 run_test_only 用；训练时无需填写

  lr_monitor:
    enable: true
    logging_interval: "epoch"

  viz_triplets:
    enable: true
    every_n_steps: 200
    num_triplets: 4

  grad_norm:
    enable: true
    every_n_steps: 50

# --------- 评估阶段（test + 离线评估&出图）---------  
eval:
  enable: true
  metrics: [psnr, ssim, mse, nmse, nmae]   # 可与现有并行
  num_eval_batches: 8
  num_plot_triplets: 6
  write_per_item: false

  # 可视化控制
  eval_vis:
    save_error_heatmap: false      # 避免和四联误差重复
    spectrum_log_scale: true       # 频谱 y 轴 dB
    spectrum_kbins: 64
    cmap: RdBu_r

  # 相对误差分位
  rel_error:
    enable: true
    percentiles: [95, 99]

  # 区域误差（按需开启）
  region_error:
    enable: true
    tiles: [3, 3]
    use_nmse: true

  multiscale_ref:
    enable: true
    kernel_sizes: [3,5,7,9,11]
    ref_mode: gauss_down_up   # 或 avgpool_up
    upsample: bicubic
    metrics: []               # 为空则沿用 eval.metrics
    dump_curves: false

  # 多尺度/频域保持兼容
  scales: { enable: false, levels: 3 }
  spectral: { enable: true, kbins: 32, fft_pad: true }

# --------- 训练种子 ---------
train:
  seed: 2025
